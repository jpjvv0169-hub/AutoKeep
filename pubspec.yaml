
name: autokeep
description: Vehicle Service Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/autokeep_icon.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/autokeep_icon.png"
  min_sdk_android: 21

