
name: Build AutoKeep APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter Android project
        run: |
          flutter create --platforms=android --project-name=autokeep --org=com.autokeep .

      - name: Install dependencies
        run: flutter pub get

      - name: Generate AutoKeep app icon
        run: dart run flutter_launcher_icons

      - name: Restore fixed signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AUTOKEEP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Signing key secret is missing."
            exit 1
          fi

          mkdir -p "$HOME/.android"

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"

          test -s "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android

      - name: Build unsigned debug APK
        run: |
          flutter build apk --debug

      - name: Sign APK with fixed key
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)"

          test -f "$APK"
          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"

          "$APKSIGNER" verify "$APK"

          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out build/app/outputs/flutter-apk/app-fixed.apk \
            "$APK"

          mv build/app/outputs/flutter-apk/app-fixed.apk "$APK"

      - name: Verify fixed signing certificate
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"

          echo "===== EXPECTED CERTIFICATE ====="

          keytool -exportcert \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -file "$RUNNER_TEMP/autokeep-cert.der"

          EXPECTED="$(sha256sum "$RUNNER_TEMP/autokeep-cert.der" | awk '{print $1}')"

          echo "Expected SHA256: $EXPECTED"

          echo "===== APK CERTIFICATE ====="

          "$APKSIGNER" verify --print-certs "$APK"

          ACTUAL="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d '[:space:]')"

          echo "Actual SHA256: $ACTUAL"

          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: APK signing certificate does not match!"
            exit 1
          fi

          echo "SUCCESS: APK uses the fixed signing key."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autokeep-android-test
          path: build/app/outputs/flutter-apk/app-debug.apk
